[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "guppy-estimand"
version = "0.1.0"
description = "Fault-tolerant physical resource estimation for guppylang/HUGR programs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kristian Koci", email = "kristian.koci@gmail.com" }]
# guppylang 1.2.0 itself requires Python >= 3.12.
requires-python = ">=3.12"
# Upper bounds are deliberate. The HUGR walker depends on the exact shapes
# guppylang compiles to (see CLAUDE.md "HUGR quirks"), and
# _qualtran_patches.CorrectedCompactDataBlock is only verified against
# qualtran 0.7.x (quantumlib/Qualtran#1943). Widen these only after the test
# suite passes on the new versions.
dependencies = [
    "guppylang>=1.2.0,<1.3",
    "hugr>=0.18.8,<0.19",
    "qualtran>=0.7.0,<0.8",
]
keywords = ["quantum", "guppylang", "hugr", "qualtran", "resource-estimation", "surface-code", "fault-tolerance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/kkoci/Estimand"
Repository = "https://github.com/kkoci/Estimand"
Issues = "https://github.com/kkoci/Estimand/issues"
Documentation = "https://github.com/kkoci/Estimand#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppy_estimand"]

[tool.hatch.build.targets.sdist]
include = [
    "src/guppy_estimand",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "CLAUDE.md",
    "VERIFICATION.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import the vendored qshelf code as `examples._qshelf_*`.
pythonpath = ["."]
